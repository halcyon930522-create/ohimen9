<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あなたの好き顔9選ジェネレーター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif;
            background-color: #fff8f9;
        }
        
        .badge-rank-1 {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #ffffff;
            box-shadow: 0 2px 5px rgba(255, 215, 0, 0.4);
        }
        
        .badge-rank-2 {
            background: linear-gradient(135deg, #C0C0C0, #8A9EA7);
            color: #ffffff;
            box-shadow: 0 2px 5px rgba(192, 192, 192, 0.4);
        }
        
        .badge-rank-3 {
            background: linear-gradient(135deg, #E67E22, #D35400);
            color: #ffffff;
            box-shadow: 0 2px 5px rgba(230, 126, 34, 0.4);
        }
        
        .badge-rank-normal {
            background: rgba(184, 82, 128, 0.85);
            color: #ffffff;
        }

        .card-shadow {
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.25);
        }

        .img-container {
            aspect-ratio: 1 / 1;
            width: 100%;
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 pb-12">

    <header class="bg-white border-b border-pink-100 sticky top-0 z-30 shadow-sm">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-full bg-pink-400 flex items-center justify-center text-white font-bold text-sm">
                    推し
                </div>
                <span class="text-xs text-pink-500 font-bold block leading-tight">推し活トリセツ<br><span class="text-gray-700 text-sm">好き顔9選</span></span>
            </div>
            <button onclick="downloadImage()" class="bg-gradient-to-r from-pink-500 to-rose-400 text-white px-4 py-1.5 rounded-full text-xs font-bold shadow-md hover:opacity-90 active:scale-95 transition flex items-center gap-1">
                <i class="fa-solid fa-download"></i> 画像を保存
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-3 py-4">

        <div class="bg-white rounded-2xl p-4 mb-4 card-shadow border border-pink-100">
            <h2 class="text-sm font-bold text-pink-500 mb-2 flex items-center gap-1.5">
                <i class="fa-solid fa-wand-magic-sparkles"></i> タイトル設定
            </h2>
            <div class="space-y-2">
                <div>
                    <label class="text-xs text-gray-500 block mb-1">メインタイトル</label>
                    <input type="text" id="input-main-title" value="あなたの好き顔9選" oninput="updateTitle()" 
                        class="w-full text-sm px-3 py-1.5 rounded-lg border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-400 font-bold text-gray-800">
                </div>
                <div>
                    <label class="text-xs text-gray-500 block mb-1">サブタイトル（任意）</label>
                    <input type="text" id="input-sub-title" value="〜私の好きなお顔を集めました〜" oninput="updateTitle()" 
                        placeholder="サブタイトルを入力..." class="w-full text-xs px-3 py-1.5 rounded-lg border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-400 text-gray-600">
                </div>
            </div>
        </div>

        <div id="capture-area" class="bg-gradient-to-b from-pink-50/50 to-white p-3 rounded-2xl card-shadow border border-pink-100">
            
            <div class="text-center my-3">
                <h1 id="display-main-title" class="text-xl font-extrabold text-gray-800 tracking-wide">
                    あなたの好き顔9選
                </h1>
                <p id="display-sub-title" class="text-xs text-pink-400 mt-0.5 font-medium">
                    〜私の好きなお顔を集めました〜
                </p>
            </div>

            <div id="grid-container" class="grid grid-cols-3 gap-2 my-2">
                <!-- Slots generated by JS -->
            </div>

            <div class="text-center mt-3 pt-2 border-t border-pink-100/60 flex justify-between items-center px-1">
                <span class="text-[10px] text-pink-300 font-bold">#好き顔9選</span>
                <span class="text-[10px] text-gray-300">推し活トリセツ</span>
            </div>
        </div>

        <div class="mt-5 space-y-2">
            <button id="save-btn" onclick="downloadImage()" class="w-full bg-gradient-to-r from-pink-500 to-rose-400 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:brightness-105 active:scale-[0.98] transition flex items-center justify-center gap-2 text-sm">
                <i class="fa-solid fa-camera"></i> 完成した画像を保存する
            </button>
            <p class="text-[11px] text-center text-gray-400">
                ※画像が表示されたら長押しで保存も可能です
            </p>
        </div>

    </main>

    <!-- Modal for Editing -->
    <div id="edit-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl relative space-y-4">
            <button onclick="closeModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 w-8 h-8 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            
            <h3 id="modal-title" class="text-base font-bold text-gray-800 text-center border-b border-gray-100 pb-2">
                枠 No.1 の編集
            </h3>

            <div class="space-y-2">
                <label class="text-xs font-bold text-gray-600 block">画像を選択</label>
                <div class="flex items-center gap-3">
                    <div id="modal-img-preview" class="w-20 h-20 rounded-xl bg-pink-50 border border-pink-200 flex items-center justify-center overflow-hidden flex-shrink-0">
                        <i class="fa-regular fa-image text-pink-300 text-2xl"></i>
                    </div>
                    <div class="flex-1">
                        <input type="file" id="modal-file-input" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
                        <button onclick="document.getElementById('modal-file-input').click()" 
                            class="w-full bg-pink-50 text-pink-600 border border-pink-200 text-xs font-bold py-2 px-3 rounded-lg hover:bg-pink-100 transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-upload"></i> 写真をアップロード
                        </button>
                        <p class="text-[10px] text-gray-400 mt-1">タップしてカメラロール・フォルダから選択</p>
                    </div>
                </div>
            </div>

            <div>
                <label class="text-xs font-bold text-gray-600 block mb-1">名前（メインテキスト）</label>
                <input type="text" id="modal-input-name" placeholder="例: 猫屋敷ひめか" 
                    class="w-full text-sm px-3 py-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-400">
            </div>

            <div>
                <label class="text-xs font-bold text-gray-600 block mb-1">グループ・説明（サブテキスト）</label>
                <input type="text" id="modal-input-group" placeholder="例: きゅーんず！" 
                    class="w-full text-sm px-3 py-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-400">
            </div>

            <div class="pt-2 flex gap-2">
                <button onclick="clearCurrentSlot()" class="w-1/3 bg-gray-100 text-gray-600 text-xs font-bold py-2.5 rounded-xl hover:bg-gray-200 transition">
                    リセット
                </button>
                <button onclick="saveModalData()" class="w-2/3 bg-pink-500 text-white text-xs font-bold py-2.5 rounded-xl hover:bg-pink-600 transition shadow-md">
                    保存する
                </button>
            </div>
        </div>
    </div>

    <!-- Modal for Result -->
    <div id="result-modal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-4 shadow-2xl relative space-y-3 max-h-[90vh] overflow-y-auto">
            <button onclick="closeResultModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 w-8 h-8 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h3 class="text-sm font-bold text-gray-800 text-center">画像が完成しました！</h3>
            <p class="text-[11px] text-gray-500 text-center">画像を長押しまたは下のボタンから保存してください。</p>
            
            <div id="result-image-container" class="rounded-xl overflow-hidden border border-gray-200 shadow-inner">
                <!-- Result image inserted here -->
            </div>

            <a id="download-link" download="oshi_9sen.png" href="#" 
                class="block w-full text-center bg-pink-500 text-white font-bold py-2.5 rounded-xl text-xs shadow-md hover:bg-pink-600 transition">
                <i class="fa-solid fa-download mr-1"></i> 画像をダウンロード
            </a>
        </div>
    </div>

    <script>
        const defaultNames = ["猫屋敷ひめか", "猫屋敷ひめか", "猫屋敷ひめか", "猫屋敷ひめか", "猫屋敷ひめか", "猫屋敷ひめか", "猫屋敷ひめか", "猫屋敷ひめか", "猫屋敷ひめか"];
        const defaultGroup = "きゅーんず！";
        
        // CORSエラーと処理遅延を防ぐため、通信の発生しないダミーSVG（Base64）を使用
        const placeholderImage = "data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='300' height='300' viewBox='0 0 300 300'%3E%3Crect width='100%25' height='100%25' fill='%23fce7f3'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='16' fill='%23f472b6'%3E%E5%86%99%E7%9C%8F%E3%82%92%E9%81%B8%E6%8A%9E%3C/text%3E%3C/svg%3E";

        const rankMapping = [4, 5, 6, 2, 1, 3, 7, 8, 9];

        let slotsData = Array.from({ length: 9 }, (_, index) => ({
            id: index + 1,
            rank: rankMapping[index],
            name: defaultNames[index],
            group: defaultGroup,
            image: placeholderImage
        }));

        let activeEditingIndex = null;
        let tempImageBase64 = null;

        document.addEventListener('DOMContentLoaded', () => {
            renderGrid();
        });

        function renderGrid() {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';

            slotsData.forEach((slot, index) => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl overflow-hidden shadow-sm border border-pink-100 flex flex-col cursor-pointer transition hover:shadow-md hover:border-pink-300 relative group';
                card.onclick = () => openModal(index);

                let badgeHtml = '';
                if (slot.rank === 1) {
                    badgeHtml = `<div class="absolute top-1.5 left-1.5 badge-rank-1 text-[10px] font-extrabold px-1.5 py-0.5 rounded-md flex items-center gap-0.5 z-10"><i class="fa-solid fa-crown text-[9px]"></i>1</div>`;
                } else if (slot.rank === 2) {
                    badgeHtml = `<div class="absolute top-1.5 left-1.5 badge-rank-2 text-[10px] font-extrabold px-1.5 py-0.5 rounded-md flex items-center gap-0.5 z-10"><i class="fa-solid fa-crown text-[9px]"></i>2</div>`;
                } else if (slot.rank === 3) {
                    badgeHtml = `<div class="absolute top-1.5 left-1.5 badge-rank-3 text-[10px] font-extrabold px-1.5 py-0.5 rounded-md flex items-center gap-0.5 z-10"><i class="fa-solid fa-crown text-[9px]"></i>3</div>`;
                } else {
                    badgeHtml = `<div class="absolute top-1.5 left-1.5 badge-rank-normal text-[10px] font-bold w-4 h-4 rounded-md flex items-center justify-center z-10">${slot.rank}</div>`;
                }

                const imageContent = slot.image 
                    ? `<img src="${slot.image}" class="w-full h-full object-cover block" alt="${slot.name}">`
                    : `<div class="w-full h-full bg-pink-50 flex flex-col items-center justify-center text-pink-300">
                        <i class="fa-solid fa-plus text-lg"></i>
                        <span class="text-[9px] mt-1 font-bold">写真を選択</span>
                       </div>`;

                card.innerHTML = `
                    ${badgeHtml}
                    <div class="img-container w-full relative overflow-hidden bg-gray-100">
                        ${imageContent}
                        <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-xs font-bold">
                            <i class="fa-solid fa-pen mr-1"></i> 編集
                        </div>
                    </div>
                    <div class="py-1 px-0.5 text-center bg-white">
                        <div class="font-bold text-[11px] text-gray-800 leading-tight truncate">${slot.name || '名前未設定'}</div>
                        <div class="text-[9px] text-gray-500 leading-tight truncate mt-0.5">${slot.group || ''}</div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function updateTitle() {
            const mainTitle = document.getElementById('input-main-title').value;
            const subTitle = document.getElementById('input-sub-title').value;

            document.getElementById('display-main-title').textContent = mainTitle || 'あなたの好き顔9選';
            document.getElementById('display-sub-title').textContent = subTitle;
        }

        function openModal(index) {
            activeEditingIndex = index;
            const slot = slotsData[index];

            document.getElementById('modal-title').textContent = `順位 Rank ${slot.rank} の編集`;
            document.getElementById('modal-input-name').value = slot.name;
            document.getElementById('modal-input-group').value = slot.group;
            
            tempImageBase64 = slot.image;
            updateModalPreview(tempImageBase64);

            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('edit-modal').classList.add('hidden');
            activeEditingIndex = null;
            tempImageBase64 = null;
            document.getElementById('modal-file-input').value = '';
        }

        function updateModalPreview(imageSrc) {
            const previewContainer = document.getElementById('modal-img-preview');
            if (imageSrc) {
                previewContainer.innerHTML = `<img src="${imageSrc}" class="w-full h-full object-cover">`;
            } else {
                previewContainer.innerHTML = `<i class="fa-regular fa-image text-pink-300 text-2xl"></i>`;
            }
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    tempImageBase64 = e.target.result;
                    updateModalPreview(tempImageBase64);
                };
                reader.readAsDataURL(file);
            }
        }

        function clearCurrentSlot() {
            tempImageBase64 = placeholderImage;
            document.getElementById('modal-input-name').value = "";
            document.getElementById('modal-input-group').value = "";
            updateModalPreview(placeholderImage);
        }

        function saveModalData() {
            if (activeEditingIndex !== null) {
                slotsData[activeEditingIndex].name = document.getElementById('modal-input-name').value;
                slotsData[activeEditingIndex].group = document.getElementById('modal-input-group').value;
                slotsData[activeEditingIndex].image = tempImageBase64 || placeholderImage;
                renderGrid();
            }
            closeModal();
        }

        function downloadImage() {
            const captureArea = document.getElementById('capture-area');
            const saveBtn = document.getElementById('save-btn');
            
            // ボタン表示を変更して処理中を明示
            const originalBtnText = saveBtn.innerHTML;
            saveBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 画像を生成中...`;
            saveBtn.disabled = true;

            // スマホに最適なpixelRatio: 2 で超高速レンダリング
            htmlToImage.toPng(captureArea, {
                pixelRatio: 2,
                backgroundColor: '#fff8f9',
                cacheBust: true
            }).then(dataUrl => {
                const resultContainer = document.getElementById('result-image-container');
                resultContainer.innerHTML = `<img src="${dataUrl}" class="w-full h-auto rounded-xl block" alt="好き顔9選">`;
                
                const downloadLink = document.getElementById('download-link');
                downloadLink.href = dataUrl;

                document.getElementById('result-modal').classList.remove('hidden');
                
                // ボタンを元に戻す
                saveBtn.innerHTML = originalBtnText;
                saveBtn.disabled = false;
            }).catch(err => {
                console.error('Image generation error:', err);
                alert('画像の生成に失敗しました。');
                saveBtn.innerHTML = originalBtnText;
                saveBtn.disabled = false;
            });
        }

        function closeResultModal() {
            document.getElementById('result-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
